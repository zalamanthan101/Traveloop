<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Traveloop – Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
:root {
  --sand:#F5EDD6; --deep:#1A1A2E; --ocean:#16213E;
  --amber:#E8A838; --coral:#E05C3A; --sage:#7BAF8F; --mist:#B8C9C0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body {
  background: var(--deep);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-image: 
    radial-gradient(ellipse at 50% 0%, rgba(232,168,56,0.12) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 100%, rgba(224,92,58,0.08) 0%, transparent 60%);
}
.auth-wrapper {
  width: 100%;
  padding: 2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.brand-logo-small {
  font-family: 'Playfair Display', serif;
  font-size: 2.2rem; font-weight: 900;
  background: linear-gradient(135deg, var(--amber), var(--coral));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-align: center; margin-bottom: 2rem; text-decoration: none;
}
.auth-card {
  width: 100%; max-width: 420px;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(232,168,56,0.15);
  border-radius: 20px;
  padding: 2.5rem;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  animation: fadeUp 0.5s ease;
}
.tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
.tab-btn {
  flex: 1; padding: 0.7rem; border-radius: 10px; border: 1px solid rgba(232,168,56,0.2);
  background: transparent; color: var(--mist);
  font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.95rem;
  cursor: pointer; transition: all 0.2s;
}
.tab-btn.active { background: linear-gradient(135deg, var(--amber), var(--coral)); color: var(--deep); border-color: transparent; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
h2 { font-family: 'Playfair Display', serif; color: var(--sand); font-size: 1.8rem; margin-bottom: 0.4rem; text-align: center; }
.subtitle { color: var(--mist); font-size: 0.9rem; margin-bottom: 2rem; text-align: center; }
.form-group { margin-bottom: 1.2rem; }
label { display: block; font-size: 0.83rem; color: var(--mist); margin-bottom: 0.4rem; font-weight: 500; }
.input-wrap { position: relative; }
.input-wrap i {
  position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
  color: var(--mist); opacity: 0.5; font-size: 0.9rem;
}
input {
  width: 100%;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(232,168,56,0.2);
  border-radius: 10px; padding: 0.75rem 1rem 0.75rem 2.5rem;
  color: var(--sand); font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
  transition: all 0.2s;
}
input:focus { outline: none; border-color: var(--amber); background: rgba(232,168,56,0.05); box-shadow: 0 0 0 3px rgba(232,168,56,0.1); }
input::placeholder { color: rgba(184,201,192,0.3); }
.btn-submit {
  width: 100%; padding: 0.85rem;
  background: linear-gradient(135deg, var(--amber), var(--coral));
  color: var(--deep); border: none; border-radius: 10px;
  font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 1rem;
  cursor: pointer; transition: all 0.2s; margin-top: 0.5rem;
}
.btn-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(232,168,56,0.35); }
.error { background: rgba(224,92,58,0.15); border: 1px solid rgba(224,92,58,0.3); color: #E05C3A; padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.88rem; margin-bottom: 1rem; text-align: center; }
.demo-hint {
  margin-top: 1.5rem; padding: 0.75rem 1rem; text-align: center;
  background: rgba(123,175,143,0.08); border: 1px solid rgba(123,175,143,0.2);
  border-radius: 10px; font-size: 0.83rem; color: var(--mist);
}
.demo-hint strong { color: var(--sage); }
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="auth-wrapper">
  <a href="/" class="brand-logo-small">✈️ Traveloop</a>
  <div class="auth-card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login', this)">Sign In</button>
      <button class="tab-btn" onclick="switchTab('signup', this)">Create Account</button>
    </div>

    {% if error %}<div class="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>{% endif %}

    <!-- LOGIN -->
    <div class="tab-panel active" id="tab-login">
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to continue planning your adventures</p>
      <form method="POST">
        <input type="hidden" name="action" value="login"/>
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="you@example.com" required/>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="Your password" required/>
          </div>
        </div>
        <button type="submit" class="btn-submit">Sign In &nbsp;→</button>
      </form>
      <div class="demo-hint">
        Demo: <strong>demo@traveloop.com</strong> / <strong>demo123</strong><br/>
        Admin: <strong>admin@traveloop.com</strong> / <strong>admin123</strong>
      </div>
    </div>

    <!-- SIGNUP -->
    <div class="tab-panel" id="tab-signup">
      <h2>Start exploring</h2>
      <p class="subtitle">Create your free account and begin planning</p>
      <form method="POST">
        <input type="hidden" name="action" value="signup"/>
        <div class="form-group">
          <label>Full Name</label>
          <div class="input-wrap">
            <i class="fas fa-user"></i>
            <input type="text" name="name" placeholder="Your name" required/>
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="you@example.com" required/>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="Min. 6 characters" minlength="6" required/>
          </div>
        </div>
        <button type="submit" class="btn-submit">Create Account &nbsp;→</button>
      </form>
    </div>
  </div>
</div>
<script>
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}
</script>
</body>
</html>
