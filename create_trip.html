{% extends "base.html" %}
{% block title %}Create Trip – Traveloop{% endblock %}
{% block head %}
<style>
.create-wrap { max-width: 600px; margin: 0 auto; }
.form-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 20px; padding: 2.5rem;
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-intro { text-align: center; margin-bottom: 2rem; }
@media (max-width: 768px) {
  .form-row { grid-template-columns: 1fr; }
}
.form-intro .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
.form-intro h2 { font-size: 1.8rem; margin-bottom: 0.4rem; }
.form-intro p { color: var(--mist); font-size: 0.9rem; }
.divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
</style>
{% endblock %}
{% block content %}
<div class="container fade-up">
  <div class="create-wrap">
    <div class="page-header" style="margin-bottom:1.5rem">
      <a href="{{ url_for('my_trips') }}" class="btn btn-ghost btn-sm"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="form-card">
      <div class="form-intro">
        <div class="icon">🌍</div>
        <h2>Plan a New Trip</h2>
        <p>Give your adventure a name and set the dates</p>
      </div>
      <form method="POST">
        <div class="form-group">
          <label>Trip Name *</label>
          <input type="text" name="name" placeholder="e.g. Europe Summer Adventure" required/>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea name="description" rows="3" placeholder="A quick summary of your trip..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Start Date</label>
            <input type="date" name="start_date"/>
          </div>
          <div class="form-group">
            <label>End Date</label>
            <input type="date" name="end_date"/>
          </div>
        </div>
        <div class="form-group">
          <label>Estimated Budget (USD)</label>
          <input type="number" name="budget" placeholder="e.g. 2500" min="0" step="10"/>
        </div>
        <div class="form-group">
          <label>Trip Type <small style="color:var(--mist);">(for smart packing suggestions)</small></label>
          <select name="trip_type">
            <option value="general">🌍 General Travel</option>
            <option value="beach">🏖️ Beach Vacation</option>
            <option value="mountains">🗻️ Mountain Trekking</option>
            <option value="city">🏙️ City Exploration</option>
            <option value="business">💼 Business Trip</option>
            <option value="adventure">🧗 Adventure / Camping</option>
          </select>
        </div>
        <hr class="divider"/>
        <button type="submit" class="btn btn-primary" style="width:100%">
          <i class="fas fa-rocket"></i> Create Trip & Add Stops →
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
